# Configuración de Railway para el FRONTEND (servicio en la raíz del repo).
# El backend vive en backend/ y se crea como OTRO servicio con root "backend".

[build]
builder = "NIXPACKS"
# Fija Node 22 (Tailwind v4 / oxide exige >= 20 y elimina los warnings EBADENGINE)
NIXPACKS_NODE_VERSION = "22"
# `rm -rf node_modules` antes de `npm ci` evita el error
# "EBUSY: resource busy or locked, rmdir node_modules/.cache"
buildCommand = "rm -rf node_modules && npm ci --no-audit --no-fund && npm run build"

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
