# Configuración de Railway para el FRONTEND (servicio en la raíz del repo).
# El backend vive en backend/ y se crea como OTRO servicio con root "backend".
#
# ── IMPORTANTE sobre dist/ ──
# dist/ NO está comiteada en el repo (ver .gitignore). La genera este
# buildCommand (`npm run build`) dentro del contenedor en cada despliegue,
# de modo que index.html y los bundles hashed (/assets/index-XXXX.js) siempre
# pertenecen al mismo build.
# Motivo: se había comiteado un dist/ PARCIAL (index.html sin sus bundles),
# el servidor respondía index.html (text/html) a /assets/*.js y el navegador
# bloqueaba el módulo: "tipo MIME ('text/html') no permitido".
# Si ese error reaparece, basta con un Redeploy (el build regenera todo).

[build]
builder = "NIXPACKS"
# Fija Node 22 (Tailwind v4 / oxide exige >= 20 y elimina los warnings EBADENGINE)
NIXPACKS_NODE_VERSION = "22"

# ── FIX del error "rm: cannot remove 'node_modules/.cache': Device or resource busy" ──
# Railway MONTA un volumen de Build Cache en node_modules/.cache: la carpeta no se
# puede borrar (es un punto de montaje), pero su contenido sí.
#  · `node_modules/*`      → el glob de bash EXCLUYE dotfiles, así que .cache no se toca
#  · `node_modules/.cache/*` → vacía el contenido del montaje sin borrar el punto de montaje
#  · `npm install` (NO `npm ci`) → npm ci ejecuta su propio "rm -rf node_modules"
#    por dentro y vuelve a chocar con el montaje (EBUSY). npm install no lo hace.
buildCommand = "rm -rf node_modules/* 2>/dev/null; rm -rf node_modules/.cache/* 2>/dev/null; npm install --no-audit --no-fund && npm run build"

[deploy]
startCommand = "node server.mjs"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
